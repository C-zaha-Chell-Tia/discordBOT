name: Run Discord Bot

on:
  schedule:
    - cron: '45 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install discord.py

      - name: Run Discord Bot
        id: run_bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          # 実行ログを bot_output.log に出力しつつ画面表示も行う
          python -u main.py > bot_output.log 2>&1 || EXIT_CODE=$?
          cat bot_output.log
          
          # EXIT_CODE が空（成功）なら 0
          EXIT_CODE=${EXIT_CODE:-0}
          echo "EXIT_CODE=$EXIT_CODE" >> $GITHUB_ENV
          exit $EXIT_CODE
        continue-on-error: true

      - name: Execute Shutdown & Record Processing Log
        if: always() # キャンセル（SIGINT/SIGTERM）やエラー時でも必ず実行する
        env:
          STEP_OUTCOME: ${{ steps.run_bot.outcome }}
          STEP_CONCLUSION: ${{ steps.run_bot.conclusion }}
          BOT_EXIT_CODE: ${{ env.EXIT_CODE }}
        run: python send_log.py
